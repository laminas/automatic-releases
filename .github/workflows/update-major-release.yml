# https://github.com/marketplace/actions/actions-tagger

name: "Keep major release version up-to-date"

on:
  release:
    types: [published]

jobs:
  actions-tagger:
    runs-on: ubuntu-latest
    steps:
      - uses: Actions-R-Us/actions-tagger@330ddfac760021349fef7ff62b372f2f691c20fb # latest
        with:
          publish_latest_tag: false
          prefer_branch_releases: false
        env:
          GITHUB_TOKEN: "${{secrets.GITHUB_TOKEN}}"
