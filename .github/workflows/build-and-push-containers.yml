name: Build and push containers

on:
  release:
    types: [published]

jobs:
  release-container:
    runs-on: ubuntu-latest

    permissions:
      contents: write # commit the pinned digest back to action.yml
      packages: write

    steps:
      - name: Compile tag list
        id: tags
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          PREFIX=ghcr.io/laminas/automatic-releases
          MAJOR="${PREFIX}:$(echo ${TAG} | cut -d. -f1)"
          MINOR="${MAJOR}.$(echo ${TAG} | cut -d. -f2)"
          PATCH="${PREFIX}:${TAG}"
          BRANCH="$(echo ${TAG} | cut -d. -f1-2).x"
          {
            echo "tag=${TAG}"
            echo "patch=${PATCH}"
            echo "branch=${BRANCH}"
            echo "tags=[\"${MAJOR}\",\"${MINOR}\",\"${PATCH}\"]"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.tags.outputs.branch }}
          fetch-depth: 0

      - name: Setup QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ join(fromJSON(steps.tags.outputs.tags), ',') }}

      - name: Pin the image digest in action.yml
        run: |
          IMAGE="docker://ghcr.io/laminas/automatic-releases:${{ steps.tags.outputs.tag }}@${{ steps.build.outputs.digest }}"
          sed -i "s|^  image: .*|  image: '${IMAGE}'|" action.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add action.yml
          git commit -m "Pin release image to ${{ steps.tags.outputs.tag }}@${{ steps.build.outputs.digest }}"
          git push origin ${{ steps.tags.outputs.branch }}
